services:
  ghost:
    image: ghost:6.78.0-alpine
    restart: unless-stopped
    environment:
      # Required Ghost configuration
      NODE_ENV: production
      url: https://blog.gagangulyani.com
      port: 2368 # Tell Ghost explicitly to use its default port

      # Database configuration (MySQL recommended for production)
      database__client: mysql
      database__connection__host: mysql
      database__connection__user: ghost
      database__connection__password: ${DB_PASSWORD:-ghost_password}
      database__connection__database: ghost

      # Mail configuration (configure in production)
      mail__transport: SMTP
      mail__options__host: ${MAIL_HOST:-smtp.mailgun.org}
      mail__options__port: ${MAIL_PORT:-587}
      mail__options__auth__user: ${MAIL_USER:-}
      mail__options__auth__pass: ${MAIL_PASS:-}
      mail__from: ${MAIL_FROM:-noreply@blog.gagangulyani.com}

      # Security
      privacy__useUpdateCheck: false

      # Web analytics (Tinybird) - views in Ghost Admin > Analytics
      tinybird__tracker__endpoint: https://blog.gagangulyani.com/.ghost/analytics/api/v1/page_hit
      tinybird__tracker__datasource: analytics_events
      tinybird__adminToken: ${TINYBIRD_ADMIN_TOKEN:-}
      tinybird__workspaceId: ${TINYBIRD_WORKSPACE_ID:-}
      tinybird__stats__endpoint: ${TINYBIRD_API_URL:-https://api.tinybird.co}

      # Admin initial setup
      GHOST_INSTALL_LOCK: "false"
    volumes:
      - ghost-content:/var/lib/ghost/content
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ghost-network
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Dokploy/Traefik labels for routing (update project name to match your Dokploy project)
      - "traefik.http.routers.blogs-mind-blogged-g3iys2-1-web.rule=Host(`blog.gagangulyani.com`)"
      - "traefik.http.routers.blogs-mind-blogged-g3iys2-1-web.entrypoints=web"
      - "traefik.http.routers.blogs-mind-blogged-g3iys2-1-websecure.rule=Host(`blog.gagangulyani.com`)"
      - "traefik.http.routers.blogs-mind-blogged-g3iys2-1-websecure.entrypoints=websecure"
      - "traefik.http.routers.blogs-mind-blogged-g3iys2-1-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.services.blogs-mind-blogged-g3iys2-1-web.loadbalancer.server.port=2368"
      - "traefik.http.services.blogs-mind-blogged-g3iys2-1-websecure.loadbalancer.server.port=2368"

  traffic-analytics:
    image: ghost/traffic-analytics:1.0.565
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PROXY_TARGET: ${TINYBIRD_API_URL:-https://api.tinybird.co}/v0/events
      SALT_STORE_TYPE: file
      SALT_STORE_FILE_PATH: /data/salts.json
      TINYBIRD_TRACKER_TOKEN: ${TINYBIRD_TRACKER_TOKEN:-}
    volumes:
      - traffic-analytics-data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - "traefik.http.routers.blogs-mind-blogged-analytics.rule=Host(`blog.gagangulyani.com`) && PathPrefix(`/.ghost/analytics`)"
      - "traefik.http.routers.blogs-mind-blogged-analytics.entrypoints=websecure"
      - "traefik.http.routers.blogs-mind-blogged-analytics.tls.certresolver=letsencrypt"
      - "traefik.http.routers.blogs-mind-blogged-analytics.middlewares=blogs-mind-blogged-analytics-strip"
      - "traefik.http.middlewares.blogs-mind-blogged-analytics-strip.stripprefix.prefixes=/.ghost/analytics"
      - "traefik.http.services.blogs-mind-blogged-analytics.loadbalancer.server.port=3000"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${DB_PASSWORD:-ghost_password}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ghost-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "ghost",
          "-p${DB_PASSWORD:-ghost_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ghost-content:
    driver: local
  mysql-data:
    driver: local
  traffic-analytics-data:
    driver: local

networks:
  ghost-network:
    driver: bridge
  dokploy-network:
    external: true
